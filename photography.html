<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title> Leap and Sleep </title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    </head>
    
    <body>
        <header>
            <nav class="navbar">
                <a href='index.html' class="logo" >
                    <img src="images/leapandsleeplogo.png" alt="Shreya logo">
                </a>

                <div class="nav-links">
                    <a href="about.html">
                        About
                    </a>
                    <a href="art.html">
                        Art & Craft
                    </a>
                    <a href="photography.html">
                        Photography
                    </a>
                    <a href="contact.html">
                        Contact
                    </a>
                </div>
            </nav>
        </header>

        <section id="photography" class="section">
            <p class="section-label"> PHOTOGRAPHY </p>
            <h2> Check out some of my photography! </h2>
            <div class="cards">
                <div>
                    <h3> side eye </h3>
                    <img src="images/side eye.webp" alt="side eye">
                </div>
                <div>
                    <h3> Buzzy beeee </h3>
                    <img src="images/bee.webp" alt="Buzzy beeee">
                </div>
                <div>
                    <h3> flutter flutter </h3>
                    <img src="images/butterfly.webp" alt="flutter flutter">
                </div>
            </div>
        </section>

        <footer>
            <p class="footer-text">
                ©️ 2026 Shreya
            </p>
        </footer>

        <div class="photo-popup">
            <span class="close" id="close-popup">&times;</span>
            <button id="prev-photo"> ⬅️</button>
            <img id="popup-image" src="" alt="Popup Image">
            <button id="next-photo">➡️</button>
        </div>

        <script>

            const photos = document.querySelectorAll('.cards img');
            const popup=document.getElementById('popup-image');
            const closePopup=document.getElementById('close-popup');
            const photoPopup=document.querySelector('.photo-popup');
            const prevPhoto=document.getElementById('prev-photo')
            const nextPhoto=document.getElementById("next-photo")
            let currentPhoto=0;

            photos.forEach(photo => {
                photo.addEventListener('click', () => {
                    photoPopup.style.display = 'flex';
                    popup.src = photo.src;
                });
            });

            closePopup.addEventListener('click', () => {
                photoPopup.style.display = 'none';
            });

            photoPopup.addEventListener('click', () => {
                photoPopup.style.display = 'none';
            });

            nextPhoto.addEventListener('click',(event)=>{
                event.stopPropagation();
                currentPhoto=(currentPhoto+1)%photos.length;
                popup.src=photos[currentPhoto].src;
            });

            prevPhoto.addEventListener('click',(event)=>{
                event.stopPropagation();
                currentPhoto=(currentPhoto-1+photos.length)%photos.length;
                popup.src=photos[currentPhoto].src;
            })
        </script>



    </body>
</html>
