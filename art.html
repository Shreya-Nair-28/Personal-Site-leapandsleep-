<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title> Leap and Sleep </title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    </head>
    <body>
        <header>
            <nav class="navbar">
                <a href='index.html' class="logo" >
                    <img src="images/leapandsleeplogo.png" alt="Shreya logo">
                </a>

                <div class="nav-links">
                    <a href="about.html">
                        About
                    </a>
                    <a href="art.html">
                        Art & Craft
                    </a>
                    <a href="photography.html">
                        Photography
                    </a>
                    <a href="contact.html">
                        Contact
                    </a>
                </div>
            </nav>
        </header>

        <section id="art-craft" class="section">
            <p class="section-label"> ART & CRAFT</p>
            <h2> Check out my creations!</h2>
            <div class="cards">
                <div>
                    <h3> Sunset mandala </h3>
                    <img src="images/mandala2.png" alt="Mandala art" class="card-image">
                   
    
                </div>
                <div>
                    <h3> Dragon eye </h3>
                    <img src="images/clay1.png" alt="Clay craft" class="card-image">
                </div>
                <div>
                    <h3> The enterprise from Star Trek </h3>
                    <img src="images/acrylic1.jpg" alt="Acrylic paintings" class="card-image">
                </div>
            </div>
        </section>

        <footer>
            <p>©️2026 SHREYA NAIR</p>
        </footer>

        <div class="photo-popup">
            <span class="close" id="close-popup">&times; </span>
            <button id="prev-photo">⬅️</button>
            <img id="popup-image" src="" alt="Popup Image">
            <button id="next-photo">➡️</button>
        </div>

        <script>
            const photos=document.querySelectorAll('.cards img');
            const popup=document.getElementById('popup-image');
            const closePopup=document.getElementById('close-popup');
            const photoPopup=document.querySelector('.photo-popup');
            const prevPhoto=document.getElementById('prev-photo');
            const nextPhoto=document.getElementById('next-photo');

            let currentPhoto=0;
            photos.forEach((photo,index)=>{
                photo.addEventListener('click',()=>
                {
                currentPhoto=index;
                photoPopup.style.display='flex';
                popup.src=photo.src;
        });
            });

            closePopup.addEventListener('click',()=>{
                photoPopup.style.display='none';
            });

            photoPopup.addEventListener('click',(event)=>{
                if(event.target===photoPopup){
                    photoPopup.style.display='none';

                }
                
            });

            nextPhoto.addEventListener('click',(event)=>{
                event.stopPropagation();
                currentPhoto=(currentPhoto+1)%photos.length;
                popup.src=photos[currentPhoto].src;
            });

            prevPhoto.addEventListener('click',(event)=>{
                event.stopPropagation();
                currentPhoto=(currentPhoto-1+photos.length)%photos.length;
                popup.src=photos[currentPhoto].src;
            });

        </script>

            
        
</body>
</html>
